<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cineminha — assistam juntos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg: #12101c; --panel: #1c1830; --panel-light: #241f3d;
    --amber: #f2a63a; --amber-dim: #7a5c22; --rose: #e85c7b;
    --text: #f3efe6; --muted: #a79fc2; --line: #322b52; --green: #5cc98a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at 50% -10%, #241f45 0%, var(--bg) 55%);
    color: var(--text); font-family:'Work Sans',sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Bebas Neue',sans-serif; letter-spacing:0.04em; }
  .mono{ font-family:'Space Mono',monospace; }
  #app{ max-width: 980px; margin:0 auto; padding: 28px 18px 60px; }

  .landing{ display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:6vh; }
  .marquee-title{ font-size: clamp(42px,9vw,76px); color: var(--amber); text-shadow: 0 0 18px rgba(242,166,58,0.35); line-height:0.95; margin:0 0 6px; }
  .subtitle{ color: var(--muted); font-size:14px; max-width:440px; margin-bottom:32px; line-height:1.5; }
  .ticket{ background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px 26px; width:100%; max-width:380px; position:relative; }
  .ticket::before,.ticket::after{ content:""; position:absolute; width:20px; height:20px; background:var(--bg); border-radius:50%; top:50%; transform:translateY(-50%); }
  .ticket::before{left:-10px;} .ticket::after{right:-10px;}
  .field{ text-align:left; margin-bottom:16px; }
  .field label{ display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:6px; }
  .field input{ width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-family:'Work Sans',sans-serif; font-size:15px; }
  .field input:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .row-inline{ display:flex; gap:8px; }
  .row-inline input{ flex:1; }
  .btn{ border:none; border-radius:8px; padding:12px 18px; font-weight:600; font-size:15px; cursor:pointer; font-family:'Work Sans',sans-serif; transition: transform .08s ease, filter .15s ease; }
  .btn:active{ transform:scale(0.97); }
  .btn-amber{ background:var(--amber); color:#1c1408; }
  .btn-amber:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); }
  .btn-ghost:hover{ color:var(--text); border-color:var(--muted); }
  .btn-full{ width:100%; }
  .hint{ color: var(--muted); font-size:11px; margin-top:18px; line-height:1.5; }

  .room-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
  .room-code-badge{ display:inline-flex; align-items:center; gap:8px; background:var(--panel-light); border:1px dashed var(--amber-dim); padding:6px 12px; border-radius:8px; font-size:13px; color:var(--amber); }
  .conn-status{ display:flex; align-items:center; gap:8px; }
  .bulbs-mini{ display:flex; gap:5px; }
  .bulb-mini{ width:9px; height:9px; border-radius:50%; background:#3a3255; transition: background .3s, box-shadow .3s; }
  .bulb-mini.lit{ background: var(--green); box-shadow: 0 0 8px 2px rgba(92,201,138,0.6); }
  .conn-label{ font-size:12px; color:var(--muted); }

  .video-wrap{ background:#000; border-radius:14px; overflow:hidden; border:1px solid var(--line); aspect-ratio:16/9; position:relative; margin-bottom:16px; }
  .video-wrap iframe, .video-wrap video{ width:100%; height:100%; border:0; display:block; }
  .video-empty{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px; text-align:center; }
  .video-empty p{ color:var(--muted); max-width:340px; font-size:13px; margin:0; line-height:1.5; }

  .change-link{ text-align:center; margin:10px 0 20px; }
  .change-link button{ background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; }

  .chat-panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .chat-title{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin:0 0 12px; }
  .chat-log{ max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .chat-msg{ font-size:14px; line-height:1.4; }
  .chat-msg .who{ color:var(--rose); font-weight:600; margin-right:6px; }
  .chat-empty{ color:var(--muted); font-size:13px; font-style:italic; }
  .quick-reacts{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .quick-reacts button{ background:var(--panel-light); border:1px solid var(--line); color:var(--text); border-radius:20px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .quick-reacts button:hover{ border-color:var(--amber); }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{ flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:14px; }
  .error-box{ background: rgba(232,92,123,0.12); border:1px solid var(--rose); color:var(--rose); padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none!important; animation:none!important; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');
  const WORDS = ['NOIR','REEL','ENCORE','MATINEE','MARQUEE','CREDITS','FOYER','SESSAO','TICKET','SCREEN'];
  let myName = '';
  let roomCode = '';
  let peer = null;
  let connections = [];
  let isHost = false;
  let currentVideo = null; // {url, kind}
  let suppressEvents = false;
  let ytPlayer = null;
  let ytReady = false;
  let pendingYT = null;

  function genCode(){
    const w = WORDS[Math.floor(Math.random()*WORDS.length)];
    const n = Math.floor(100+Math.random()*899);
    return w+'-'+n;
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function sanitizeRoomId(code){
    return 'cineminha-' + code.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');
  }
  function youtubeId(url){
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
    return m ? m[1] : null;
  }

  // ---------------- Landing ----------------
  function renderLanding(){
    app.innerHTML = `
      <div class="landing">
        <h1 class="marquee-title display">CINEMINHA</h1>
        <p class="subtitle">Sincronizem play, pause e avanço automaticamente — cole um link do YouTube (pode ser "não listado") ou um link direto de arquivo de vídeo (.mp4).</p>
        <div class="ticket">
          <div class="field">
            <label for="nameInput">Seu nome</label>
            <input id="nameInput" type="text" placeholder="Como querem te chamar?" maxlength="20">
          </div>
          <div class="field">
            <label for="codeInput">Código da sala</label>
            <div class="row-inline">
              <input id="codeInput" type="text" placeholder="ex: NOIR-482" class="mono" maxlength="20">
              <button class="btn btn-ghost" id="genBtn" title="Gerar novo código">🎲</button>
            </div>
          </div>
          <button class="btn btn-amber btn-full" id="enterBtn">Entrar na sala</button>
        </div>
        <p class="hint">Os dois precisam estar online ao mesmo tempo — a conexão é direta entre os dois aparelhos. Se um estiver numa rede de trabalho/faculdade bem travada, a conexão pode falhar; wi-fi doméstico costuma funcionar bem.</p>
      </div>
    `;
    document.getElementById('genBtn').onclick = () => { document.getElementById('codeInput').value = genCode(); };
    document.getElementById('enterBtn').onclick = () => {
      myName = document.getElementById('nameInput').value.trim() || 'Convidado';
      let code = document.getElementById('codeInput').value.trim().toUpperCase();
      if(!code) code = genCode();
      roomCode = code;
      renderRoomShell();
      connectPeer();
    };
  }

  // ---------------- Room shell ----------------
  function renderRoomShell(){
    app.innerHTML = `
      <div class="room-header">
        <div>
          <h2 class="marquee-title display" style="font-size:32px;margin:0 0 6px;">CINEMINHA</h2>
          <span class="room-code-badge mono">🎟 ${escapeHtml(roomCode)}</span>
        </div>
        <div class="conn-status">
          <div class="bulbs-mini" id="bulbsMini"><div class="bulb-mini"></div><div class="bulb-mini"></div><div class="bulb-mini"></div></div>
          <span class="conn-label" id="connLabel">conectando...</span>
        </div>
      </div>

      <div id="errorSlot"></div>

      <div class="video-wrap" id="videoWrap">
        <div class="video-empty" id="videoEmpty">
          <p>Nenhum vídeo na sala ainda. Cole um link do YouTube ou um link direto de arquivo de vídeo:</p>
          <div class="row-inline" style="width:100%;max-width:420px;">
            <input id="videoInput" type="text" placeholder="https://youtube.com/watch?v=... ou https://.../video.mp4" style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);">
            <button class="btn btn-amber" id="setVideoBtn">Colocar</button>
          </div>
        </div>
        <div id="ytFrame" style="display:none;width:100%;height:100%;"></div>
        <video id="fileVideo" controls style="display:none;"></video>
      </div>

      <div class="change-link" id="changeLinkRow" style="display:none;">
        <button id="changeLinkBtn">trocar o vídeo da sala</button>
      </div>

      <div class="chat-panel">
        <p class="chat-title">Coordenação</p>
        <div class="quick-reacts">
          <button data-msg="🍿 pronto!">🍿 pronto!</button>
          <button data-msg="⏳ um minuto">⏳ um minuto</button>
          <button data-msg="👋 oi!">👋 oi!</button>
        </div>
        <div class="chat-log" id="chatLog"><p class="chat-empty">Nenhuma mensagem ainda.</p></div>
        <div class="chat-input-row">
          <input id="chatInput" type="text" placeholder="Escreva algo..." maxlength="200">
          <button class="btn btn-amber" id="sendBtn">Enviar</button>
        </div>
      </div>
    `;
    document.getElementById('setVideoBtn').onclick = onSetVideo;
    document.getElementById('videoInput').addEventListener('keydown', e => { if(e.key==='Enter') onSetVideo(); });
    document.getElementById('changeLinkBtn').onclick = () => {
      currentVideo = null;
      document.getElementById('ytFrame').style.display='none';
      document.getElementById('fileVideo').style.display='none';
      document.getElementById('videoEmpty').style.display='flex';
      document.getElementById('changeLinkRow').style.display='none';
    };
    document.getElementById('sendBtn').onclick = onSendChat;
    document.getElementById('chatInput').addEventListener('keydown', e => { if(e.key==='Enter') onSendChat(); });
    document.querySelectorAll('.quick-reacts button').forEach(b => { b.onclick = () => sendChat(b.dataset.msg); });
  }

  function showError(msg){
    const slot = document.getElementById('errorSlot');
    if(slot) slot.innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
  }
  function setConnLabel(text, litCount){
    const label = document.getElementById('connLabel');
    if(label) label.textContent = text;
    const bulbs = document.querySelectorAll('#bulbsMini .bulb-mini');
    bulbs.forEach((b,i) => b.classList.toggle('lit', i < litCount));
  }

  // ---------------- P2P connection ----------------
  function connectPeer(){
    const id = sanitizeRoomId(roomCode);
    setConnLabel('conectando...', 1);
    peer = new Peer(id);
    peer.on('open', () => {
      isHost = true;
      setConnLabel('aguardando a outra pessoa...', 2);
      peer.on('connection', conn => setupConnection(conn));
    });
    peer.on('error', (err) => {
      if(err.type === 'unavailable-id'){
        isHost = false;
        const guest = new Peer();
        guest.on('open', () => {
          peer = guest;
          const conn = peer.connect(id, { reliable: true });
          setupConnection(conn);
        });
        guest.on('error', () => showError('Não consegui entrar na sala. Verifique o código e tente de novo.'));
      } else if (err.type === 'peer-unavailable') {
        showError('Sala não encontrada. Confira se o código está certo.');
      } else {
        showError('Erro de conexão (' + err.type + '). Tente recarregar a página.');
      }
    });
  }

  function setupConnection(conn){
    connections.push(conn);
    conn.on('open', () => {
      setConnLabel('conectado 🎬', 3);
      conn.send({type:'presence', name: myName});
      if(isHost && currentVideo) conn.send({type:'setVideo', url: currentVideo.url, kind: currentVideo.kind});
    });
    conn.on('data', data => handleData(data));
    conn.on('close', () => {
      connections = connections.filter(c => c !== conn);
      setConnLabel('a outra pessoa saiu', 1);
    });
    conn.on('error', () => setConnLabel('erro na conexão', 1));
  }

  function broadcast(data){
    connections.forEach(c => { if(c.open) c.send(data); });
  }

  function handleData(data){
    if(data.type === 'presence'){
      appendChatSystem(data.name + ' entrou na sala');
    } else if(data.type === 'chat'){
      appendChatMessage(data.name, data.text);
    } else if(data.type === 'setVideo'){
      applyVideo(data.url, data.kind);
    } else if(data.type === 'play'){
      remoteApply(() => { seekIfNeeded(data.time); playCurrent(); });
    } else if(data.type === 'pause'){
      remoteApply(() => { seekIfNeeded(data.time); pauseCurrent(); });
    } else if(data.type === 'seek'){
      remoteApply(() => { seekIfNeeded(data.time); });
    }
  }

  function remoteApply(fn){
    suppressEvents = true;
    fn();
    setTimeout(() => { suppressEvents = false; }, 500);
  }

  // ---------------- Video control ----------------
  function onSetVideo(){
    const raw = document.getElementById('videoInput').value.trim();
    if(!raw) return;
    const ytId = youtubeId(raw);
    const kind = ytId ? 'youtube' : 'file';
    currentVideo = { url: raw, kind };
    applyVideo(raw, kind);
    broadcast({type:'setVideo', url: raw, kind});
  }

  function applyVideo(url, kind){
    currentVideo = { url, kind };
    document.getElementById('videoEmpty').style.display = 'none';
    document.getElementById('changeLinkRow').style.display = 'block';
    if(kind === 'youtube'){
      document.getElementById('fileVideo').style.display = 'none';
      document.getElementById('ytFrame').style.display = 'block';
      const id = youtubeId(url);
      loadYouTube(id);
    } else {
      stopYouTube();
      document.getElementById('ytFrame').style.display = 'none';
      const v = document.getElementById('fileVideo');
      v.style.display = 'block';
      v.src = url;
      attachFileVideoEvents(v);
    }
  }

  let fileEventsAttached = false;
  function attachFileVideoEvents(v){
    if(fileEventsAttached) return;
    fileEventsAttached = true;
    v.addEventListener('play', () => { if(!suppressEvents) broadcast({type:'play', time: v.currentTime}); });
    v.addEventListener('pause', () => { if(!suppressEvents) broadcast({type:'pause', time: v.currentTime}); });
    v.addEventListener('seeked', () => { if(!suppressEvents) broadcast({type:'seek', time: v.currentTime}); });
  }

  function loadYouTube(videoId){
    pendingYT = videoId;
    if(window.YT && window.YT.Player){
      createOrLoadYT();
    } else if(!document.getElementById('yt-api-script')){
      const tag = document.createElement('script');
      tag.id = 'yt-api-script';
      tag.src = 'https://www.youtube.com/iframe_api';
      document.body.appendChild(tag);
      window.onYouTubeIframeAPIReady = () => { ytReady = true; createOrLoadYT(); };
    }
  }
  function createOrLoadYT(){
    if(!pendingYT) return;
    if(ytPlayer){
      ytPlayer.loadVideoById(pendingYT);
      return;
    }
    ytPlayer = new YT.Player('ytFrame', {
      videoId: pendingYT,
      playerVars: { rel: 0, playsinline: 1 },
      events: { onStateChange: onYTStateChange }
    });
  }
  function stopYouTube(){
    if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
  }
  function onYTStateChange(e){
    if(suppressEvents || !ytPlayer) return;
    if(e.data === YT.PlayerState.PLAYING){
      broadcast({type:'play', time: ytPlayer.getCurrentTime()});
    } else if(e.data === YT.PlayerState.PAUSED){
      broadcast({type:'pause', time: ytPlayer.getCurrentTime()});
    }
  }

  function playCurrent(){
    if(!currentVideo) return;
    if(currentVideo.kind === 'youtube' && ytPlayer) ytPlayer.playVideo();
    else { const v = document.getElementById('fileVideo'); if(v) v.play().catch(()=>{}); }
  }
  function pauseCurrent(){
    if(!currentVideo) return;
    if(currentVideo.kind === 'youtube' && ytPlayer) ytPlayer.pauseVideo();
    else { const v = document.getElementById('fileVideo'); if(v) v.pause(); }
  }
  function seekIfNeeded(time){
    if(!currentVideo || typeof time !== 'number') return;
    if(currentVideo.kind === 'youtube' && ytPlayer && ytPlayer.getCurrentTime){
      if(Math.abs(ytPlayer.getCurrentTime() - time) > 1) ytPlayer.seekTo(time, true);
    } else {
      const v = document.getElementById('fileVideo');
      if(v && Math.abs(v.currentTime - time) > 1) v.currentTime = time;
    }
  }

  // ---------------- Chat ----------------
  function appendChatMessage(name, text){
    const log = document.getElementById('chatLog');
    if(!log) return;
    const empty = log.querySelector('.chat-empty');
    if(empty) log.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = `<span class="who">${escapeHtml(name)}</span>${escapeHtml(text)}`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  function appendChatSystem(text){
    const log = document.getElementById('chatLog');
    if(!log) return;
    const empty = log.querySelector('.chat-empty');
    if(empty) log.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.style.color = 'var(--muted)';
    div.style.fontStyle = 'italic';
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  function sendChat(text){
    text = (text||'').trim();
    if(!text) return;
    appendChatMessage(myName, text);
    broadcast({type:'chat', name: myName, text});
  }
  function onSendChat(){
    const input = document.getElementById('chatInput');
    const text = input.value;
    input.value = '';
    sendChat(text);
  }

  renderLanding();
})();
</script>
</body>
</html>
