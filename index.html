<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salão dos Reinos — assistam juntos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg: #0c0b0d; --panel: #171418; --panel-light: #201b20;
    --fire: #d9642f; --fire-dim: #6b3418; --ember: #f0a247;
    --ice: #6f97ab; --text: #e9e0cd; --muted: #9a8f82; --line: #3a322c; --lit: #7fae63;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 700px 400px at 50% -8%, rgba(217,100,47,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 900px 600px at 90% 110%, rgba(111,151,171,0.10) 0%, transparent 60%),
      var(--bg);
    color: var(--text); font-family:'EB Garamond',serif; min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .display{ font-family:'Cinzel',serif; letter-spacing:0.06em; }
  .mono{ font-family:'Space Mono',monospace; }
  #app{ max-width: 980px; margin:0 auto; padding: 28px 18px 60px; }

  .landing{ display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:6vh; }
  .marquee-title{
    font-size: clamp(34px,7.5vw,58px); font-weight:900; color: var(--ember);
    text-shadow: 0 0 22px rgba(217,100,47,0.45), 0 0 3px rgba(0,0,0,0.6);
    line-height:1.05; margin:0 0 10px; text-transform:uppercase;
  }
  .subtitle{ color: var(--muted); font-size:16px; max-width:460px; margin-bottom:32px; line-height:1.6; font-style:italic; }
  .ticket{
    background: linear-gradient(180deg, var(--panel) 0%, #14111400 200%), var(--panel);
    border:1px solid var(--line); border-radius:4px; padding:32px 28px; width:100%; max-width:380px;
    position:relative; box-shadow: 0 0 0 1px rgba(217,100,47,0.08), 0 18px 40px rgba(0,0,0,0.5);
  }
  .ticket::before{
    content:"⚔"; position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    background: var(--bg); color: var(--fire); font-size:20px; padding:2px 10px; border:1px solid var(--line); border-radius:50%;
  }
  .field{ text-align:left; margin-bottom:18px; }
  .field label{ display:block; font-family:'Cinzel',serif; font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--fire); margin-bottom:7px; }
  .field input{ width:100%; padding:11px 12px; border-radius:3px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-family:'EB Garamond',serif; font-size:16px; }
  .field input:focus{ outline:1px solid var(--fire); outline-offset:1px; }
  .row-inline{ display:flex; gap:8px; }
  .row-inline input{ flex:1; }
  .btn{ border:none; border-radius:3px; padding:12px 18px; font-weight:700; font-size:14px; cursor:pointer; font-family:'Cinzel',serif; letter-spacing:0.06em; text-transform:uppercase; transition: transform .08s ease, filter .15s ease, box-shadow .15s ease; }
  .btn:active{ transform:scale(0.97); }
  .btn-amber{ background: linear-gradient(180deg, var(--ember), var(--fire)); color:#1a0d04; box-shadow: 0 0 16px rgba(217,100,47,0.3); }
  .btn-amber:hover{ filter:brightness(1.1); }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); font-family:'EB Garamond',serif; text-transform:none; letter-spacing:0; font-weight:400; }
  .btn-ghost:hover{ color:var(--text); border-color:var(--muted); }
  .btn-full{ width:100%; }
  .hint{ color: var(--muted); font-size:12px; margin-top:20px; line-height:1.6; max-width:420px; }

  .room-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:16px; }
  .room-code-badge{
    display:inline-flex; align-items:center; gap:8px; background:var(--panel-light);
    border:1px solid var(--fire-dim); padding:7px 14px; border-radius:3px; font-size:13px; color:var(--ember);
    font-family:'Space Mono',monospace;
  }
  .conn-status{ display:flex; align-items:center; gap:9px; }
  .bulbs-mini{ display:flex; gap:6px; }
  .bulb-mini{ width:9px; height:12px; border-radius:1px 1px 4px 4px; background:#3a322c; transition: background .3s, box-shadow .3s; }
  .bulb-mini.lit{ background: var(--fire); box-shadow: 0 0 8px 3px rgba(217,100,47,0.55); }
  .conn-label{ font-size:12px; color:var(--muted); font-style:italic; }

  .video-wrap{ background:#000; border-radius:4px; overflow:hidden; border:1px solid var(--line); box-shadow: 0 0 0 1px rgba(217,100,47,0.06); aspect-ratio:16/9; position:relative; margin-bottom:18px; }
  .video-wrap iframe, .video-wrap video{ width:100%; height:100%; border:0; display:block; }
  .video-empty{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px; text-align:center; }
  .video-empty p{ color:var(--muted); max-width:340px; font-size:14px; margin:0; line-height:1.6; }

  .change-link{ text-align:center; margin:10px 0 22px; }
  .change-link button{ background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; font-family:'EB Garamond',serif; }

  .chat-panel{ background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:18px; }
  .chat-title{ font-family:'Cinzel',serif; font-size:12px; text-transform:uppercase; letter-spacing:0.12em; color:var(--fire); margin:0 0 14px; }
  .chat-log{ max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:9px; margin-bottom:14px; }
  .chat-msg{ font-size:15px; line-height:1.5; }
  .chat-msg .who{ color:var(--ice); font-weight:600; margin-right:6px; font-family:'Cinzel',serif; font-size:13px; }
  .chat-empty{ color:var(--muted); font-size:14px; font-style:italic; }
  .quick-reacts{ display:flex; gap:7px; margin-bottom:12px; flex-wrap:wrap; }
  .quick-reacts button{ background:var(--panel-light); border:1px solid var(--line); color:var(--text); border-radius:3px; padding:7px 13px; font-size:13px; cursor:pointer; font-family:'EB Garamond',serif; }
  .quick-reacts button:hover{ border-color:var(--fire); }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{ flex:1; padding:10px 12px; border-radius:3px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:15px; font-family:'EB Garamond',serif; }
  .error-box{ background: rgba(111,151,171,0.10); border:1px solid var(--ice); color:var(--ice); padding:10px 14px; border-radius:3px; font-size:13px; margin-bottom:16px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none!important; animation:none!important; } }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  const app = document.getElementById('app');
  const WORDS = ['CORVO','FOGO','TROVA','NEVE','CINZAS','SELO','TOCHA','VIGIA','ELMO','BRASAO'];
  let myName = '';
  let roomCode = '';
  let peer = null;
  let connections = [];
  let isHost = false;
  let currentVideo = null;
  let suppressEvents = false;
  let ytPlayer = null;
  let ytReady = false;
  let pendingYT = null;

  function genCode(){
    const w = WORDS[Math.floor(Math.random()*WORDS.length)];
    const n = Math.floor(100+Math.random()*899);
    return w+'-'+n;
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function sanitizeRoomId(code){
    return 'saloreinos-' + code.trim().toUpperCase().replace(/[^A-Z0-9-]/g,'');
  }
  function youtubeId(url){
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{6,})/);
    return m ? m[1] : null;
  }
  function normalizeVideoUrl(url){
    if(/^https?:\/\/(www\.)?dropbox\.com\//i.test(url)){
      let out = url.replace(/^https?:\/\/(www\.)?dropbox\.com\//i, 'https://dl.dropboxusercontent.com/');
      if(/[?&]dl=0/.test(out)) out = out.replace(/([?&])dl=0/, '$1dl=1');
      else if(/dl=1/.test(out)) { /* already correct */ }
      else out += (out.includes('?') ? '&' : '?') + 'dl=1';
      return out;
    }
    return url;
  }

  // ---------------- Landing ----------------
  function renderLanding(){
    app.innerHTML = `
      <div class="landing">
        <h1 class="marquee-title display">Salão dos Reinos</h1>
        <p class="subtitle">Reúna seu séquito diante das chamas. Cole um link do YouTube (pode ser "não listado") ou um link direto de arquivo de vídeo — o filme começa junto, para os dois.</p>
        <div class="ticket">
          <div class="field">
            <label for="nameInput">Seu nome de casa</label>
            <input id="nameInput" type="text" placeholder="Como te chamam nos salões?" maxlength="20">
          </div>
          <div class="field">
            <label for="codeInput">Selo da sala</label>
            <div class="row-inline">
              <input id="codeInput" type="text" placeholder="ex: CORVO-482" class="mono" maxlength="20">
              <button class="btn btn-ghost" id="genBtn" title="Forjar novo selo">🔥</button>
            </div>
          </div>
          <button class="btn btn-amber btn-full" id="enterBtn">Adentrar o salão</button>
        </div>
        <p class="hint">Os dois precisam estar diante das telas ao mesmo tempo — a passagem é aberta direto entre os dois castelos. Redes muito vigiadas (trabalho, faculdade) podem barrar a passagem; um lar comum costuma deixá-la livre.</p>
      </div>
    `;
    document.getElementById('genBtn').onclick = () => { document.getElementById('codeInput').value = genCode(); };
    document.getElementById('enterBtn').onclick = () => {
      myName = document.getElementById('nameInput').value.trim() || 'Andarilho';
      let code = document.getElementById('codeInput').value.trim().toUpperCase();
      if(!code) code = genCode();
      roomCode = code;
      renderRoomShell();
      connectPeer();
    };
  }

  // ---------------- Room shell ----------------
  function renderRoomShell(){
    app.innerHTML = `
      <div class="room-header">
        <div>
          <h2 class="marquee-title display" style="font-size:26px;margin:0 0 8px;">Salão dos Reinos</h2>
          <span class="room-code-badge">🕯 ${escapeHtml(roomCode)}</span>
        </div>
        <div class="conn-status">
          <div class="bulbs-mini" id="bulbsMini"><div class="bulb-mini"></div><div class="bulb-mini"></div><div class="bulb-mini"></div></div>
          <span class="conn-label" id="connLabel">acendendo os fogos...</span>
        </div>
      </div>

      <div id="errorSlot"></div>

      <div class="video-wrap" id="videoWrap">
        <div class="video-empty" id="videoEmpty">
          <p>Nenhuma projeção nas paredes ainda. Cole um link do YouTube ou um link direto de arquivo de vídeo:</p>
          <div class="row-inline" style="width:100%;max-width:420px;">
            <input id="videoInput" type="text" placeholder="https://youtube.com/watch?v=... ou https://.../video.mp4" style="flex:1;padding:10px;border-radius:3px;border:1px solid var(--line);background:var(--bg);color:var(--text);">
            <button class="btn btn-amber" id="setVideoBtn">Projetar</button>
          </div>
        </div>
        <div id="ytFrame" style="display:none;width:100%;height:100%;"></div>
        <video id="fileVideo" controls style="display:none;"></video>
      </div>

      <div class="change-link" id="changeLinkRow" style="display:none;">
        <button id="changeLinkBtn">trocar a projeção do salão</button>
      </div>

      <div class="chat-panel">
        <p class="chat-title">Mensageiros</p>
        <div class="quick-reacts">
          <button data-msg="🍖 pronto na mesa!">🍖 pronto!</button>
          <button data-msg="⏳ um instante">⏳ um instante</button>
          <button data-msg="🐦 aqui, chegando">🐦 cheguei</button>
        </div>
        <div class="chat-log" id="chatLog"><p class="chat-empty">Nenhum corvo chegou ainda.</p></div>
        <div class="chat-input-row">
          <input id="chatInput" type="text" placeholder="Envie palavra..." maxlength="200">
          <button class="btn btn-amber" id="sendBtn">Enviar</button>
        </div>
      </div>
    `;
    document.getElementById('setVideoBtn').onclick = onSetVideo;
    document.getElementById('videoInput').addEventListener('keydown', e => { if(e.key==='Enter') onSetVideo(); });
    document.getElementById('changeLinkBtn').onclick = () => {
      currentVideo = null;
      document.getElementById('ytFrame').style.display='none';
      document.getElementById('fileVideo').style.display='none';
      document.getElementById('videoEmpty').style.display='flex';
      document.getElementById('changeLinkRow').style.display='none';
    };
    document.getElementById('sendBtn').onclick = onSendChat;
    document.getElementById('chatInput').addEventListener('keydown', e => { if(e.key==='Enter') onSendChat(); });
    document.querySelectorAll('.quick-reacts button').forEach(b => { b.onclick = () => sendChat(b.dataset.msg); });
  }

  function showError(msg){
    const slot = document.getElementById('errorSlot');
    if(slot) slot.innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
  }
  function setConnLabel(text, litCount){
    const label = document.getElementById('connLabel');
    if(label) label.textContent = text;
    const bulbs = document.querySelectorAll('#bulbsMini .bulb-mini');
    bulbs.forEach((b,i) => b.classList.toggle('lit', i < litCount));
  }

  // ---------------- P2P connection ----------------
  function connectPeer(){
    const id = sanitizeRoomId(roomCode);
    setConnLabel('acendendo os fogos...', 1);
    peer = new Peer(id);
    peer.on('open', () => {
      isHost = true;
      setConnLabel('aguardando o outro viajante...', 2);
      peer.on('connection', conn => setupConnection(conn));
    });
    peer.on('error', (err) => {
      if(err.type === 'unavailable-id'){
        isHost = false;
        const guest = new Peer();
        guest.on('open', () => {
          peer = guest;
          const conn = peer.connect(id, { reliable: true });
          setupConnection(conn);
        });
        guest.on('error', () => showError('Não foi possível abrir a passagem. Confira o selo e tente de novo.'));
      } else if (err.type === 'peer-unavailable') {
        showError('Salão não encontrado. Confira se o selo está certo.');
      } else {
        showError('Os fogos falharam (' + err.type + '). Tente recarregar a página.');
      }
    });
  }

  function setupConnection(conn){
    connections.push(conn);
    conn.on('open', () => {
      setConnLabel('passagem aberta 🔥', 3);
      conn.send({type:'presence', name: myName});
      if(isHost && currentVideo) conn.send({type:'setVideo', url: currentVideo.url, kind: currentVideo.kind});
    });
    conn.on('data', data => handleData(data));
    conn.on('close', () => {
      connections = connections.filter(c => c !== conn);
      setConnLabel('o outro viajante partiu', 1);
    });
    conn.on('error', () => setConnLabel('a passagem tremeluziu', 1));
  }

  function broadcast(data){
    connections.forEach(c => { if(c.open) c.send(data); });
  }

  function handleData(data){
    if(data.type === 'presence'){
      appendChatSystem(data.name + ' adentrou o salão');
    } else if(data.type === 'chat'){
      appendChatMessage(data.name, data.text);
    } else if(data.type === 'setVideo'){
      applyVideo(data.url, data.kind);
    } else if(data.type === 'play'){
      remoteApply(() => { seekIfNeeded(data.time); playCurrent(); });
    } else if(data.type === 'pause'){
      remoteApply(() => { seekIfNeeded(data.time); pauseCurrent(); });
    } else if(data.type === 'seek'){
      remoteApply(() => { seekIfNeeded(data.time); });
    }
  }

  function remoteApply(fn){
    suppressEvents = true;
    fn();
    setTimeout(() => { suppressEvents = false; }, 500);
  }

  // ---------------- Video control ----------------
  function onSetVideo(){
    let raw = document.getElementById('videoInput').value.trim();
    if(!raw) return;
    const ytId = youtubeId(raw);
    const kind = ytId ? 'youtube' : 'file';
    if(kind === 'file') raw = normalizeVideoUrl(raw);
    currentVideo = { url: raw, kind };
    applyVideo(raw, kind);
    broadcast({type:'setVideo', url: raw, kind});
  }

  function applyVideo(url, kind){
    currentVideo = { url, kind };
    document.getElementById('videoEmpty').style.display = 'none';
    document.getElementById('changeLinkRow').style.display = 'block';
    if(kind === 'youtube'){
      document.getElementById('fileVideo').style.display = 'none';
      document.getElementById('ytFrame').style.display = 'block';
      const id = youtubeId(url);
      loadYouTube(id);
    } else {
      stopYouTube();
      document.getElementById('ytFrame').style.display = 'none';
      const v = document.getElementById('fileVideo');
      v.style.display = 'block';
      v.src = url;
      attachFileVideoEvents(v);
    }
  }

  let fileEventsAttached = false;
  function attachFileVideoEvents(v){
    if(fileEventsAttached) return;
    fileEventsAttached = true;
    v.addEventListener('play', () => { if(!suppressEvents) broadcast({type:'play', time: v.currentTime}); });
    v.addEventListener('pause', () => { if(!suppressEvents) broadcast({type:'pause', time: v.currentTime}); });
    v.addEventListener('seeked', () => { if(!suppressEvents) broadcast({type:'seek', time: v.currentTime}); });
  }

  function loadYouTube(videoId){
    pendingYT = videoId;
    if(window.YT && window.YT.Player){
      createOrLoadYT();
    } else if(!document.getElementById('yt-api-script')){
      const tag = document.createElement('script');
      tag.id = 'yt-api-script';
      tag.src = 'https://www.youtube.com/iframe_api';
      document.body.appendChild(tag);
      window.onYouTubeIframeAPIReady = () => { ytReady = true; createOrLoadYT(); };
    }
  }
  function createOrLoadYT(){
    if(!pendingYT) return;
    if(ytPlayer){
      ytPlayer.loadVideoById(pendingYT);
      return;
    }
    ytPlayer = new YT.Player('ytFrame', {
      videoId: pendingYT,
      playerVars: { rel: 0, playsinline: 1 },
      events: { onStateChange: onYTStateChange }
    });
  }
  function stopYouTube(){
    if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
  }
  function onYTStateChange(e){
    if(suppressEvents || !ytPlayer) return;
    if(e.data === YT.PlayerState.PLAYING){
      broadcast({type:'play', time: ytPlayer.getCurrentTime()});
    } else if(e.data === YT.PlayerState.PAUSED){
      broadcast({type:'pause', time: ytPlayer.getCurrentTime()});
    }
  }

  function playCurrent(){
    if(!currentVideo) return;
    if(currentVideo.kind === 'youtube' && ytPlayer) ytPlayer.playVideo();
    else { const v = document.getElementById('fileVideo'); if(v) v.play().catch(()=>{}); }
  }
  function pauseCurrent(){
    if(!currentVideo) return;
    if(currentVideo.kind === 'youtube' && ytPlayer) ytPlayer.pauseVideo();
    else { const v = document.getElementById('fileVideo'); if(v) v.pause(); }
  }
  function seekIfNeeded(time){
    if(!currentVideo || typeof time !== 'number') return;
    if(currentVideo.kind === 'youtube' && ytPlayer && ytPlayer.getCurrentTime){
      if(Math.abs(ytPlayer.getCurrentTime() - time) > 1) ytPlayer.seekTo(time, true);
    } else {
      const v = document.getElementById('fileVideo');
      if(v && Math.abs(v.currentTime - time) > 1) v.currentTime = time;
    }
  }

  // ---------------- Chat ----------------
  function appendChatMessage(name, text){
    const log = document.getElementById('chatLog');
    if(!log) return;
    const empty = log.querySelector('.chat-empty');
    if(empty) log.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = `<span class="who">${escapeHtml(name)}</span>${escapeHtml(text)}`;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  function appendChatSystem(text){
    const log = document.getElementById('chatLog');
    if(!log) return;
    const empty = log.querySelector('.chat-empty');
    if(empty) log.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.style.color = 'var(--muted)';
    div.style.fontStyle = 'italic';
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  function sendChat(text){
    text = (text||'').trim();
    if(!text) return;
    appendChatMessage(myName, text);
    broadcast({type:'chat', name: myName, text});
  }
  function onSendChat(){
    const input = document.getElementById('chatInput');
    const text = input.value;
    input.value = '';
    sendChat(text);
  }

  renderLanding();
})();
</script>
</body>
</html>
